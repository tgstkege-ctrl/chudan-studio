<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chudan AI - Video Generator Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .navbar {
      width: 100%;
      background-color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 30px;
      border-bottom: 1px solid #334155;
    }
    .nav-brand { font-size: 22px; font-weight: bold; color: #38bdf8; }
    .lang-select {
      background-color: #0f172a;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 550px;
      width: 90%;
      text-align: center;
      margin-top: 30px;
      border: 1px solid #334155;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
      resize: none;
      margin-top: 15px;
    }

    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      font-weight: bold;
    }

    .video-wrapper {
      position: relative;
      overflow: hidden;
      width: 100%;
      border-radius: 10px;
      border: 2px solid #38bdf8;
      margin-top: 15px;
      display: none;
      background: #000;
    }

    img, video {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    .watermark-overlay {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #38bdf8;
    }

    .loader { display: none; margin: 20px 0; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="nav-brand">🎬 Chudan AI Video Studio</div>
    <select id="langSelect" class="lang-select">
      <option value="am">አማርኛ</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="container">
    <h1>Chudan AI Video Generator</h1>
    <p style="color: #94a3b8; font-size: 14px;">የቪዲዮውን ሀሳብ ያስገቡ</p>
    
    <textarea id="promptInput" placeholder="ምሳሌ፦ የሚበር ድመት በሰማይ ላይ..."></textarea>
    
    <button onclick="generateAIVideo()">ቪዲዮ ፍጠር (Generate Video)</button>

    <div id="loader" class="loader">⏳ Chudan AI ተንቀሳቃሽ ቪዲዮ እያዘጋጀ ነው... ትንሽ ይቆዩ...</div>

    <div id="videoWrapper" class="video-wrapper">
      <img id="resultVideo" src="" alt="AI Motion Output">
      <div class="watermark-overlay">Chudan AI</div>
    </div>
  </div>

  <script>
    async function translateToEnglish(text) {
      try {
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=am|en`);
        const data = await response.json();
        return data.responseData.translatedText || text;
      } catch (error) { return text; }
    }

    async function generateAIVideo() {
      const promptInput = document.getElementById('promptInput').value;
      const loader = document.getElementById('loader');
      const videoWrapper = document.getElementById('videoWrapper');
      const resultVideo = document.getElementById('resultVideo');

      if (!promptInput.trim()) {
        alert("እባክዎን ሀሳብ ያስገቡ!");
        return;
      }

      loader.style.display = 'block';
      videoWrapper.style.display = 'none';

      try {
        const translatedPrompt = await translateToEnglish(promptInput);
        const encodedPrompt = encodeURIComponent(translatedPrompt + " motion video animation loop");
        const randomSeed = Math.floor(Math.random() * 99999);
        
        // Motion/Animation GIF/Video Generator URL
        const generatedUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${randomSeed}&width=800&height=800&nologo=true`;

        resultVideo.src = generatedUrl;
        resultVideo.onload = () => {
          loader.style.display = 'none';
          videoWrapper.style.display = 'block';
        };

      } catch (error) {
        alert("ስህተት ተፈጥሯል!");
        loader.style.display = 'none';
      }
    }
  </script>

</body>
</html>
